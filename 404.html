<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101010">
  <title>Page not found — Hari Krishna P A</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .error-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: var(--gutter);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: "";
      position: absolute;
      top: -20rem;
      left: 50%;
      width: 42rem;
      height: 42rem;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 243, 107, 0.07), transparent 62%);
      pointer-events: none;
    }
    .error-card {
      position: relative;
      width: min(100%, 34rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      text-align: center;
    }
    .error-card .brand {
      justify-content: center;
      margin-bottom: 2rem;
    }
    .error-code {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
    }
    .error-card h1 {
      margin-top: 0.6rem;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.04em;
    }
    .error-card p {
      margin: 0.9rem auto 1.75rem;
      max-width: 26rem;
      color: var(--text-muted);
    }
    .error-card .btn {
      display: inline-flex;
    }
    .error-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 1.5rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
    }
    .error-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="error-page">
    <div class="error-card">
      <a class="brand" href="/" aria-label="Hari Krishna P A — home">
        <span class="brand__mark" aria-hidden="true">HK</span>
        <span class="brand__name">Hari Krishna P A</span>
      </a>
      <span class="error-code">HTTP 404 / ROUTE NOT FOUND</span>
      <h1>This path doesn't exist.</h1>
      <p>
        The page may have moved, or the URL might be mistyped. The good stuff is still one click away.
      </p>
      <a class="btn btn--primary" href="/">Back to the portfolio</a>
      <div class="error-links">
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
        <a href="/resume.html">Résumé</a>
      </div>
    </div>
  </main>
</body>
</html>
